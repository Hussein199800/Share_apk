name: Release

# Builds a signed release APK and publishes it once per version, so the in-app
# updater ("More → Updates") can find it. Runs only when the signing secrets exist:
#   SHAREAPK_KEYSTORE_BASE64  base64 of the upload keystore (alias "upload")
#   SHAREAPK_STORE_PASSWORD   keystore password
#   SHAREAPK_KEY_PASSWORD     key password
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.SHAREAPK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Signing secrets not set; skipping release."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.sign.outputs.path != ''
        env:
          KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          STORE_PASSWORD: ${{ secrets.SHAREAPK_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SHAREAPK_KEY_PASSWORD }}
        run: |
          # The debug signing config must exist for Gradle to configure; it is not used here.
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Publish release (once per version)
        if: steps.sign.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "shareapk-$VER.apk"
          # Stable name for .../releases/latest/download/shareapk.apk (website download button).
          cp app/build/outputs/apk/release/app-release.apk shareapk.apk
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "v$VER already published; ensuring stable asset"
            gh release upload "v$VER" shareapk.apk || echo "shareapk.apk already attached"
          else
            gh release create "v$VER" "shareapk-$VER.apk" shareapk.apk --title "شارك أبك $VER" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
